# Dev container for the frontend: a single workspace container, no database.
# Paths are relative to this file's directory (.devcontainer/).
services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        TZ: Europe/London
        CLAUDE_CODE_VERSION: stable
    command: sleep infinity
    # Needed on Linux hosts; Docker Desktop already defines host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      CLAUDE_CONFIG_DIR: /home/dev/.claude
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DISABLE_AUTOUPDATER: "1"
    volumes:
      - ..:/workspace:cached
      - ../.git:/workspace/.git:ro
      # Keep Linux node_modules (esbuild, rollup binaries) separate from any host install
      - node_modules:/workspace/node_modules
      - bashhistory:/commandhistory
      - claude-config:/home/dev/.claude
    tmpfs:
      - /workspace/secrets

  # Makes localhost:8000 inside the app container reach the backend running on the host.
  # Shares app's network namespace, so it is subject to the same firewall.
  backend-forward:
    image: alpine/socat
    network_mode: "service:app"
    restart: unless-stopped
    command: TCP-LISTEN:8000,fork,reuseaddr TCP:host.docker.internal:8000

volumes:
  node_modules:
  bashhistory:
  claude-config:

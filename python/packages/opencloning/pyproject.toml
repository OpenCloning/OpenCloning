[project]
name = "opencloning"
version = "2.2.2"  # x-release-please-version
description = "Backend of OpenCloning, a web application to generate molecular cloning strategies in json format, and share them with others."
readme = "README.md"
license = "MIT"
authors = [{ name = "Manuel Lera-Ramirez", email = "manulera14@gmail.com" }]
requires-python = ">=3.11,<4"
dependencies = [
    "beautifulsoup4>=4.15.0,<5",
    "biopython>=1.87",
    "certifi>=2026.10.18",
    "fastapi>=0.135.3",
    "httpx2>=2.16.0",
    "networkx>=3.6.1",
    "numpy>=2.4.4",
    "opencloning-linkml>=1.0.0",
    "python-multipart>=0.0.26",
    "uvicorn>=0.44.0",
    "pydantic>=2.7.1",
    "pydantic-core>=2.41.5",
    "pandas>=3.1.1,<4",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.2",
    "primer3-py>=2.3",
    "pairwise-alignments-to-msa>=0.1.1",
    "pydna>=5.5.16",
    "starlette>=1.3.1",
    "gunicorn>=26.0.0",
    "python-json-logger>=4.2.0,<5",
    "uvicorn-worker>=0.4.0,<0.5",
]

[project.urls]
Repository = "https://github.com/OpenCloning/OpenCloning"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencloning"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.deptry]
known_first_party = ["opencloning"]
per_rule_ignores = { DEP002 = [
    "python-multipart",
    "gunicorn",
    "uvicorn",
    "openpyxl",
    "uvicorn-worker",
] }

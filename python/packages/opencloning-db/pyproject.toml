[project]
name = "opencloning-db"
version = "2.2.1"  # x-release-please-version
description = "Database for OpenCloning, a web application to generate molecular cloning strategies in json format, and share them with others."
readme = "README.md"
license = "MIT"
authors = [{ name = "Manuel Lera-Ramirez", email = "manulera14@gmail.com" }]
requires-python = ">=3.11,<4"
dependencies = [
    "opencloning==2.2.1",                # x-release-please-version
    "fastapi>=0.162.2",
    "fastapi-pagination>=0.16.2,<0.17",
    "opencloning-linkml>=1.0.0",
    "pydantic[email]>=2.14.3",
    "psycopg[binary]>=3.3.8,<4",
    "sqlalchemy>=2.0.41,<3",
    "alembic>=1.18.4",
    "PyJWT[crypto]>=2.10.1,<3",
    "pydna>=5.5.16",
    "starlette>=1.3.1",
    "gunicorn>=26.0.0",
]

[project.urls]
Repository = "https://github.com/OpenCloning/OpenCloning"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencloning_db"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "alembic.ini"
"alembic" = "alembic"

[tool.uv.sources]
opencloning = { workspace = true }

[tool.black]
skip-string-normalization = true
line-length = 119

[tool.deptry]
known_first_party = ["opencloning_db"]
per_rule_ignores = { DEP002 = ["psycopg", "gunicorn"] }

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "opencloning-mcp"
version = "0.1.0"
description = "Proof of concept MCP server to build OpenCloning cloning strategies from an AI assistant."
readme = "README.md"
license = "MIT"
authors = [{ name = "Manuel Lera-Ramirez", email = "manulera14@gmail.com" }]
requires-python = ">=3.11,<4"
dependencies = [
    "opencloning",
    "opencloning-linkml>=1.0.0",
    "biopython>=1.88",
    "fastapi>=0.135.3",
    "mcp>=2.3,<3",
    "pydantic>=2.7.1",
    "pydna>=5.5.16",
    "sqlalchemy>=2.0.41,<3",
    "starlette>=1.3.1",
    "uvicorn",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
opencloning-mcp = "opencloning_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencloning_mcp"]

[tool.uv.sources]
opencloning = { workspace = true }

[tool.black]
skip-string-normalization = true
line-length = 119

[tool.deptry]
known_first_party = ["opencloning_mcp"]
# psycopg is the driver of the Postgres OPENCLONING_MCP_DB_URL
per_rule_ignores = { DEP002 = ["psycopg"] }

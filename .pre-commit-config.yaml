# Git hooks for the whole monorepo. Hooks run from the repo root, so paths are relative to it.
# Install once (from anywhere in the repo): cd python && uv run pre-commit install

# Files no hook may touch:
# - Yarn-managed files, and .patch files (whitespace is significant)
# - Data: sequence/table files, test fixtures, examples and generated stubs. Tests compare against
#   them byte for byte, so whitespace "fixes" can break them.
exclude: |
  (?x)^(
    js/\.yarn/.*|
    .*\.patch|
    .*\.(gb|gbk|dna|ape|fasta|ab1|embl|tsv|csv|svg)|
    js/apps/opencloning/public/examples/.*|
    js/cypress/(test_files|test_starting_point)/.*|
    python/packages/[^/]+/tests/test_files/.*|
    python/stubs/.*|
    static_content/.*
  )$

repos:
  # --- General ---------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
      - id: end-of-file-fixer
      - id: double-quote-string-fixer

  # --- python/ ---------------------------------------------------------------
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/flake8
    rev: 7.5.0
    hooks:
      - id: flake8
        # flake8 only reads its config from the working directory
        args: [--config=python/.flake8]
  - repo: local
    hooks:
      # Remove metadata changes from notebooks to avoid diff contamination
      - id: nbstripout
        name: nbstripout with keep-output
        entry: |
          python -m nbstripout --keep-output $@
        language: system
        files: ^python/.*\.ipynb$
        exclude: ^python/packages/opencloning/tests/
      # httpx2 is only imported in http_client.py
      - id: httpx-import-check
        name: httpx-import-check
        entry: python python/scripts/check_httpx_imports.py
        language: system
        files: ^python/.*\.py$
        exclude: ^python/(packages/opencloning/tests|scripts)/
      # primer3 is only imported in primer3_functions.py, to centralize how its settings are handled
      - id: primer3-import-check
        name: primer3-import-check
        entry: python python/scripts/check_primer3_imports.py
        language: system
        files: ^python/.*\.py$
        exclude: ^python/packages/opencloning/tests/
      # deptry runs from python/ (uv --directory), so its paths are relative to python/
      - id: deptry
        name: deptry
        entry: uv run --directory python deptry --config packages/opencloning/pyproject.toml packages/opencloning/src
        language: system
        pass_filenames: false
        files: ^python/(packages/opencloning/(src/.*|pyproject\.toml)|pyproject\.toml)$
      - id: deptry-opencloning-db
        name: deptry (opencloning-db)
        entry: uv run --directory python deptry --config packages/opencloning-db/pyproject.toml packages/opencloning-db/src
        language: system
        pass_filenames: false
        files: ^python/(packages/opencloning-db/(src/.*|pyproject\.toml)|pyproject\.toml)$
      - id: deptry-opencloning-mcp
        name: deptry (opencloning-mcp)
        entry: uv run --directory python deptry --config packages/opencloning-mcp/pyproject.toml packages/opencloning-mcp/src
        language: system
        pass_filenames: false
        files: ^python/(packages/opencloning-mcp/(src/.*|pyproject\.toml)|pyproject\.toml)$

  # --- js/ (pygrep: fails if the regex matches a line in a staged file) -------
  - repo: local
    hooks:
      - id: no-it-only
        name: no it.only() in tests
        language: pygrep
        entry: 'it\.only\('
        files: ^js/.*\.(cy\.jsx?|test\.js)$
      - id: no-it-skip
        name: 'no it.skip() in tests (unless the line has an "allow-skip: <reason>" comment)'
        language: pygrep
        entry: 'it\.skip\((?!.*allow-skip)'
        files: ^js/.*\.(cy\.jsx?|test\.js)$
      - id: no-axios-outside-clients
        name: axios only imported in client files
        language: pygrep
        entry: 'import.*axios|axios.*import'
        files: ^js/(apps|packages)/.*\.jsx?$
        exclude: |
          (?x)^js/(
            .*test\.jsx?|
            apps/syntax-builder/.*|
            apps/opencloning/build/.*|
            .*/(node_modules|dist|build)/.*|
            packages/utils/src/utils/httpClients\.js|
            packages/opencloning-elabftw/src/common\.js|
            packages/opencloningdb/src/common\.js
          )$
      - id: no-mui-subpath-imports
        name: "MUI imported from the main package, not subpaths (e.g. import { Button } from '@mui/material')"
        language: pygrep
        entry: "from '@mui/(material/[A-Z]|icons-material/)"
        files: ^js/(apps|packages)/.*/src/.*\.jsx?$
      # Only errors fail the hook (--quiet); warnings are not enforced. Runs from js/ (where
      # eslint.config.js is), so the js/ prefix is stripped from the paths. Needs the js/ dependencies (yarn install).
      - id: eslint
        name: eslint (errors only)
        entry: bash -c 'cd js && exec node_modules/.bin/eslint --quiet --no-warn-ignored "${@#js/}"' --
        language: system
        files: ^js/.*\.(js|jsx|mjs|cjs)$
      # JS equivalent of deptry: fails on dependencies that are declared but not imported, or imported
      # but not declared (each workspace must declare what it imports, not rely on yarn hoisting).
      # Runs on the whole js/ tree, so filenames are not passed. Needs the js/ dependencies (yarn install).
      - id: knip
        name: knip (unused / unlisted JS dependencies)
        entry: bash -c 'cd js && exec node_modules/.bin/knip --include dependencies,unlisted'
        language: system
        pass_filenames: false
        files: ^js/(.*/)?(package\.json|[^/]+\.config\.[cm]?js|.*\.(js|jsx|mjs|cjs))$
        exclude: ^js/.*/(node_modules|dist|build)/
      # Styles go in the MUI theme, a component or sx (see .claude/skills/mui-styling).
      # The excluded files are being migrated (styling-plan.md): remove each one from the list when it is deleted.
      - id: no-new-css-files
        name: no new CSS files (use the MUI theme, a component or sx; see .claude/skills/mui-styling)
        language: fail
        entry: 'New CSS files are not allowed:'
        files: ^js/(apps|packages)/.*\.css$
        exclude: |
          (?x)^js/(
            apps/opencloningdb/src/index\.css|
            apps/standalone-app/src/index\.css|
            apps/syntax-builder/src/index\.css|
            packages/ui/src/index\.css|
            packages/ui/src/components/NetworkTree\.css
          )$
